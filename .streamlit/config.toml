# Do not set server.port here.
# - Streamlit Community Cloud expects :8501
# - Railway passes --server.port=$PORT via Procfile / railway.toml
#
# Local: if another app already uses 8501, run:
#   streamlit run app.py --server.port 8510

[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

# Match AI Gaze navy so the first paint isn't Streamlit white/red
[theme]
base = "dark"
primaryColor = "#e8a820"
backgroundColor = "#0a1f4a"
secondaryBackgroundColor = "#103466"
textColor = "#f1f5f9"
font = "sans serif"
